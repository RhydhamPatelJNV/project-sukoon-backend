[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-sukoon-backend"
version = "0.1.0"
description = "Project Sukoon — Deterministic Quantitative Research, Risk Governance, and Paper Trading System"
authors = [{ name = "Project Sukoon Engineering Team" }]
license = { text = "Proprietary" }
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.110.0,<0.111.0",
    "uvicorn[standard]>=0.29.0,<0.30.0",
    "pydantic>=2.6.4,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "sqlalchemy>=2.0.28,<2.1.0",
    "asyncpg>=0.29.0,<0.30.0",
    "duckdb>=0.10.0,<0.11.0",
    "polars>=0.20.15,<0.21.0",
    "pyarrow>=15.0.0,<16.0.0",
    "httpx>=0.27.0,<0.28.0",
    "alpaca-py>=0.21.0,<0.22.0",
    "scipy>=1.12.0,<1.13.0",
    "statsmodels>=0.14.1,<0.15.0",
    "cryptography>=42.0.5,<43.0.0",
    "python-telegram-bot>=20.8,<21.0",
    "ulid-py>=1.1.0,<1.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1,<9.0.0",
    "pytest-asyncio>=0.23.5,<0.24.0",
    "hypothesis>=6.98.15,<7.0.0",
    "ruff>=0.3.3,<0.4.0",
    "mypy>=1.9.0,<2.0.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N", "UP", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
